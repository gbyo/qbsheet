name: Scoring mutation testing

on:
  workflow_dispatch:
  schedule:
    - cron: '30 7 * * 1'

permissions:
  contents: read

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Mutate critical scoring boundaries
        run: npm run test:mutation -- --force

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scoring-mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
