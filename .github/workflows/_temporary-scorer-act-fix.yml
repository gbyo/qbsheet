name: Temporary Scorer act fix

on:
  push:
    branches:
      - fix/scorer-test-act-warnings

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scorer-test-act-warnings

      - name: Apply test fix and remove temporary workflow
        shell: python
        run: |
          from pathlib import Path

          path = Path('tests/RoomScorerUi.test.tsx')
          text = path.read_text()
          old = """    expect(sync).toHaveBeenCalledTimes(1);
              await vi.advanceTimersByTimeAsync(9_999);
              expect(sync).toHaveBeenCalledTimes(1);
              await vi.advanceTimersByTimeAsync(1);
              expect(sync).toHaveBeenCalledTimes(2);"""
          new = """    expect(sync).toHaveBeenCalledTimes(1);
              await act(() => vi.advanceTimersByTimeAsync(9_999));
              expect(sync).toHaveBeenCalledTimes(1);
              await act(() => vi.advanceTimersByTimeAsync(1));
              expect(sync).toHaveBeenCalledTimes(2);"""
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one target block, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/_temporary-scorer-act-fix.yml').unlink()

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/RoomScorerUi.test.tsx .github/workflows/_temporary-scorer-act-fix.yml
          git commit -m "test: wrap scorer retry timers in act"
          git push origin HEAD:fix/scorer-test-act-warnings
