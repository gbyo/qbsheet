name: Apply connected-room manual-game fix

on:
  push:
    branches:
      - "fix/connected-room-manual-game"

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply focused source changes
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old!r}')
              file.write_text(text.replace(old, new, 1))

          replace(
              'src/app/ConnectedRoom.tsx',
              "  onPractice: () => void;\n  onOtherScoring: () => void;",
              "  onPractice: () => void;\n  onCreateGame: () => void;\n  onOtherScoring: () => void;",
          )
          replace(
              'src/app/ConnectedRoom.tsx',
              "    onPractice,\n    onReadiness,",
              "    onPractice,\n    onCreateGame,\n    onReadiness,",
          )
          replace(
              'src/app/ConnectedRoom.tsx',
              """        <button
          type=\"button\"
          className=\"shell-button shell-button-quiet\"
          onClick={onOtherScoring}
          disabled={starting}
        >
          Other scoring options
        </button>""",
              """        <button
          type=\"button\"
          className=\"shell-button shell-button-quiet\"
          onClick={onCreateGame}
          disabled={starting}
        >
          Create game manually
        </button>
        <button
          type=\"button\"
          className=\"shell-button shell-button-quiet\"
          onClick={onOtherScoring}
          disabled={starting}
        >
          Other scoring options
        </button>""",
          )

          replace(
              'src/app/App.tsx',
              "        onPractice={() => setScreen({ kind: 'practice' })}\n        onOtherScoring={() => setScreen({ kind: 'home' })}",
              "        onPractice={() => setScreen({ kind: 'practice' })}\n        onCreateGame={() => setScreen({ kind: 'create' })}\n        onOtherScoring={() => setScreen({ kind: 'home' })}",
          )
          replace(
              'src/app/App.tsx',
              "        onCancel={() => setScreen({ kind: 'home' })}",
              "        onCancel={() => setScreen(pairedRoom ? { kind: 'room' } : { kind: 'home' })}",
          )
          replace(
              'src/app/App.tsx',
              "    const backToRoom = current.connected && pairedRoom !== null;",
              "    const backToRoom = pairedRoom !== null && (current.connected || isManualGame(current.package));",
          )

          replace(
              'tests/ConnectedRoomStatus.test.tsx',
              "      onPractice={() => undefined}\n      onOtherScoring={() => undefined}",
              "      onPractice={() => undefined}\n      onCreateGame={() => undefined}\n      onOtherScoring={() => undefined}",
          )
          replace(
              'tests/ConnectedRoomStatus.test.tsx',
              """afterEach(() => {
  cleanup();
  vi.useRealTimers();
});

describe('the waiting room’s arcade banner', () => {""",
              """afterEach(() => {
  cleanup();
  vi.useRealTimers();
});

describe('connected-room manual fallback', () => {
  test('opens the existing manual game creator directly without removing other scoring fallback', async () => {
    const onCreateGame = vi.fn();
    renderRoom({ onCreateGame });
    await settle();

    fireEvent.click(screen.getByRole('button', { name: 'Create game manually' }));

    expect(onCreateGame).toHaveBeenCalledTimes(1);
    expect(screen.getByRole('button', { name: 'Other scoring options' })).toBeInTheDocument();
  });
});

describe('the waiting room’s arcade banner', () => {""",
          )
          PY

      - name: Remove staging workflow from final branch
        run: git rm .github/workflows/apply-connected-room-manual-game.yml

      - name: Verify diff shape
        run: |
          git diff --check
          git diff -- src/app/ConnectedRoom.tsx src/app/App.tsx tests/ConnectedRoomStatus.test.tsx

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/ConnectedRoom.tsx src/app/App.tsx tests/ConnectedRoomStatus.test.tsx .github/workflows/apply-connected-room-manual-game.yml
          git commit -m "Fix manual game fallback from connected rooms"
          git push origin HEAD:fix/connected-room-manual-game
