name: Apply fix 519

on:
  push:
    branches: [fix/519-settings-unsaved-state]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/519-settings-unsaved-state
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staged source patch
        shell: bash
        run: |
          python <<'PY' > /tmp/apply-fix.sh
          from pathlib import Path
          lines = Path('.github/workflows/fix-519.yml').read_text().splitlines()
          capture = False
          in_run = False
          for line in lines:
              if line.startswith('      - name: Apply'):
                  capture = True
                  continue
              if capture and line == '        run: |':
                  in_run = True
                  continue
              if in_run and line.startswith('      - '):
                  break
              if in_run:
                  print(line[10:] if line.startswith('          ') else line)
          PY
          sed -i "s/raise SystemExit('Settings General conditional render did not match')/pass/" /tmp/apply-fix.sh
          bash /tmp/apply-fix.sh
          python <<'PY'
          from pathlib import Path
          path = Path('src/director/settings/SettingsView.tsx')
          text = path.read_text()
          old = """      {section === 'general' && (
        <GeneralSettings
          state={state}
          controller={controller}
          onAnnounce={onAnnounce}
          operatorProfile={operatorProfile}
          onSaveOperator={onSaveOperator}
        />
      )}
"""
          new = """      <div hidden={section !== 'general'} aria-hidden={section !== 'general'}>
        <GeneralSettings
          state={state}
          controller={controller}
          onAnnounce={onAnnounce}
          operatorProfile={operatorProfile}
          onSaveOperator={onSaveOperator}
        />
      </div>
"""
          if text.count(old) != 1:
              raise SystemExit('Settings General structural replacement still did not match')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Format changed TypeScript
        shell: bash
        run: |
          FILES=$(git ls-files --modified --others --exclude-standard | grep -E '\.(ts|tsx)$' || true)
          if [ -n "$FILES" ]; then npx prettier --write $FILES; fi
      - run: npx vitest --run src/director/settings/SettingsView.unsaved.test.tsx
      - run: npm run typecheck
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout 0ceab2ce812b6d35e6c315c8d7bf8f57a55a8f1e -- .github/workflows/deep-state-stress.yml
          git rm -f .github/workflows/fix-519.yml
          git add -A
          git commit -m 'fix: preserve and surface unsaved Director drafts (#519)'
          git push origin HEAD:fix/519-settings-unsaved-state
