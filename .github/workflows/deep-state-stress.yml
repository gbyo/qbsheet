name: Apply fix 517 UI

on:
  push:
    branches: [fix/517-archived-tournaments-readonly]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/517-archived-tournaments-readonly
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Add persistent archived read-only affordance
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('src/director/app/DirectorApp.tsx')
          text = path.read_text()
          anchor = """            {(controller.writerStatus === 'blocked' || controller.writerStatus === 'unavailable') && (
"""
          banner = """            {tournament.status === 'archived' && (
              <Callout
                tone=\"info\"
                title=\"Archived tournament · read only\"
                actions={
                  <Button
                    variant=\"secondary\"
                    onClick={() =>
                      void controller.reopenTournament().then((reopened) => {
                        if (reopened) announce(`${tournament.name} reopened as a draft.`);
                        else announce(errorNotice('The archived tournament could not be reopened.'));
                      })
                    }
                  >
                    Reopen as draft
                  </Button>
                }
              >
                Historical tournament data is protected from edits. Reopen the tournament as a draft before making changes.
              </Callout>
            )}
"""
          if text.count(anchor) != 1:
              raise SystemExit('archived banner insertion point did not match')
          path.write_text(text.replace(anchor, banner + anchor, 1))
          PY
          npx prettier --write src/director/app/DirectorApp.tsx
      - run: npx vitest --run tests/DirectorArchivedReadonly.test.tsx
      - run: npm run typecheck
      - name: Commit verified UI fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout 0ceab2ce812b6d35e6c315c8d7bf8f57a55a8f1e -- .github/workflows/deep-state-stress.yml
          rm -f scripts/tmp-trigger-517.txt
          git add -A
          git commit -m 'fix: show archived tournaments as read-only (#517)'
          git push origin HEAD:fix/517-archived-tournaments-readonly
