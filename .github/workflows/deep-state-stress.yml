name: Apply fix 523

on:
  push:
    branches: [fix/523-shell-file-open-errors]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/523-shell-file-open-errors
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staged source patch
        shell: bash
        run: |
          python <<'PY' > /tmp/apply-fix.sh
          from pathlib import Path
          lines = Path('.github/workflows/fix-523.yml').read_text().splitlines()
          capture = False
          in_run = False
          for line in lines:
              if line.startswith('      - name: Apply'):
                  capture = True
                  continue
              if capture and line == '        run: |':
                  in_run = True
                  continue
              if in_run and line.startswith('      - '):
                  break
              if in_run:
                  print(line[10:] if line.startswith('          ') else line)
          PY
          bash /tmp/apply-fix.sh
      - name: Format changed TypeScript
        shell: bash
        run: |
          FILES=$(git ls-files --modified --others --exclude-standard | grep -E '\.(ts|tsx)$' || true)
          if [ -n "$FILES" ]; then npx prettier --write $FILES; fi
      - run: npx vitest --run src/director/components/fileSelection.test.ts
      - run: npm run typecheck
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout 0ceab2ce812b6d35e6c315c8d7bf8f57a55a8f1e -- .github/workflows/deep-state-stress.yml
          git rm -f .github/workflows/fix-523.yml
          git add -A
          git commit -m 'fix: share tournament file selection error handling (#523)'
          git push origin HEAD:fix/523-shell-file-open-errors
