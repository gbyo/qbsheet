name: Apply fix 516

on:
  push:
    branches: [fix/516-block-switch-after-save-failure]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/516-block-switch-after-save-failure
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply staged source patch
        shell: bash
        run: |
          python <<'PY' > /tmp/apply-fix.sh
          from pathlib import Path
          lines = Path('.github/workflows/fix-516.yml').read_text().splitlines()
          capture = False
          in_run = False
          for line in lines:
              if line.startswith('      - name: Apply'):
                  capture = True
                  continue
              if capture and line == '        run: |':
                  in_run = True
                  continue
              if in_run and line.startswith('      - '):
                  break
              if in_run:
                  print(line[10:] if line.startswith('          ') else line)
          PY
          bash /tmp/apply-fix.sh
          python <<'PY'
          from pathlib import Path
          path = Path('tests/DirectorDocumentTransitions.test.tsx')
          text = path.read_text()
          text = text.replace(
              "async function setup() {\n  const repository = new FailingRepository();",
              "let setupSequence = 0;\n\nasync function setup() {\n  const suffix = ++setupSequence;\n  const repository = new FailingRepository();",
              1,
          )
          text = text.replace("first.tournament!.id = 'tournament-first';", "first.tournament!.id = `tournament-first-${suffix}`;", 1)
          text = text.replace("second.tournament!.id = 'tournament-second';", "second.tournament!.id = `tournament-second-${suffix}`;", 1)
          text = text.replace("expect(hook.result.current.state.tournament?.id).toBe('tournament-first');", "expect(hook.result.current.state.tournament?.id).toMatch(/^tournament-first-/);", 1)
          path.write_text(text)
          PY
      - run: npx prettier --write src/director/state/useDirectorController.ts tests/DirectorDocumentTransitions.test.tsx
      - run: npx vitest --run tests/DirectorDocumentTransitions.test.tsx
      - run: npm run typecheck
      - name: Commit verified fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout 0ceab2ce812b6d35e6c315c8d7bf8f57a55a8f1e -- .github/workflows/deep-state-stress.yml
          git rm -f .github/workflows/fix-516.yml
          git add -A
          git commit -m 'fix: block unsafe Director document transitions (#516)'
          git push origin HEAD:fix/516-block-switch-after-save-failure
