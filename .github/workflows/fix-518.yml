name: Apply fix 518

on:
  push:
    branches: [fix/518-new-tournament-success-contract]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/518-new-tournament-success-contract
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply fix and regression tests
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          controller = Path('src/director/state/useDirectorController.ts')
          text = controller.read_text()
          text = text.replace('  createTournament(input: NewTournamentInput): void;','  createTournament(input: NewTournamentInput): boolean;',1)
          old = """  const createTournament = useCallback(
    (input: NewTournamentInput) => {
      const now = isoNow();
      const tournamentId = newDirectorId('tournament');
      const formatId = newDirectorId('format');
      const phaseId = newDirectorId('phase');
      commit((draft) => {
"""
          new = """  const createTournament = useCallback(
    (input: NewTournamentInput): boolean => {
      const now = isoNow();
      const tournamentId = newDirectorId('tournament');
      const formatId = newDirectorId('format');
      const phaseId = newDirectorId('phase');
      return commit((draft) => {
"""
          if text.count(old) != 1:
              raise SystemExit('createTournament implementation did not match expected main revision')
          controller.write_text(text.replace(old,new,1))

          app = Path('src/director/app/DirectorApp.tsx')
          text = app.read_text()
          text = text.replace('function NewTournamentDialog({','export function NewTournamentDialog({',1)
          old = """    onSubmit: (draft) => {
      controller.createTournament({
        name: draft.name.trim(),
        date: draft.date,
        venue: draft.venue,
        organizer: draft.organizer,
      });
      onCreated(draft.name.trim());
    },
"""
          new = """    onSubmit: (draft) => {
      const created = controller.createTournament({
        name: draft.name.trim(),
        date: draft.date,
        venue: draft.venue,
        organizer: draft.organizer,
      });
      if (!created) return false;
      onCreated(draft.name.trim());
      return true;
    },
"""
          if text.count(old) != 1:
              raise SystemExit('NewTournamentDialog submit block did not match expected main revision')
          app.write_text(text.replace(old,new,1))
          PY
          cat > src/director/app/DirectorApp.newTournament.test.tsx <<'EOF'
          import { fireEvent, render, screen } from '@testing-library/react';
          import { describe, expect, test, vi } from 'vitest';
          import { NewTournamentDialog } from './DirectorApp';
          import type { DirectorController } from '../state/useDirectorController';

          function controllerReturning(created: boolean): DirectorController {
            return {
              createTournament: vi.fn(() => created),
            } as unknown as DirectorController;
          }

          describe('NewTournamentDialog creation contract', () => {
            test('keeps the draft open and does not announce success when creation is rejected', () => {
              const controller = controllerReturning(false);
              const onClose = vi.fn();
              const onCreated = vi.fn();
              render(<NewTournamentDialog controller={controller} onClose={onClose} onCreated={onCreated} />);

              fireEvent.change(screen.getByLabelText('Name'), { target: { value: 'Rejected tournament' } });
              fireEvent.click(screen.getByRole('button', { name: 'Create tournament' }));

              expect(controller.createTournament).toHaveBeenCalledTimes(1);
              expect(onCreated).not.toHaveBeenCalled();
              expect(onClose).not.toHaveBeenCalled();
              expect(screen.getByDisplayValue('Rejected tournament')).toBeInTheDocument();
            });

            test('announces creation exactly once after the controller accepts it', () => {
              const controller = controllerReturning(true);
              const onCreated = vi.fn();
              render(<NewTournamentDialog controller={controller} onClose={vi.fn()} onCreated={onCreated} />);

              fireEvent.change(screen.getByLabelText('Name'), { target: { value: 'Accepted tournament' } });
              fireEvent.click(screen.getByRole('button', { name: 'Create tournament' }));

              expect(controller.createTournament).toHaveBeenCalledTimes(1);
              expect(onCreated).toHaveBeenCalledTimes(1);
              expect(onCreated).toHaveBeenCalledWith('Accepted tournament');
            });
          });
          EOF
      - run: npx prettier --write src/director/state/useDirectorController.ts src/director/app/DirectorApp.tsx src/director/app/DirectorApp.newTournament.test.tsx
      - run: npx vitest --run src/director/app/DirectorApp.newTournament.test.tsx
      - run: npm run typecheck
      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-518.yml
          git add src/director/state/useDirectorController.ts src/director/app/DirectorApp.tsx src/director/app/DirectorApp.newTournament.test.tsx
          git commit -m 'fix: honor tournament creation failures (#518)'
          git push origin HEAD:fix/518-new-tournament-success-contract
