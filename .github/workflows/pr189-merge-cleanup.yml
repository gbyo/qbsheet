name: PR 189 merge cleanup

on:
  push:
    branches:
      - gibby/issues-2

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !contains(github.event.head_commit.message, '[pr189-merge-cleanup]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Clean union merge artifacts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          path = Path('src/director/state/useDirectorController.ts')
          text = path.read_text()
          text = replace_once(
              text,
              "import { createDirectorRepository, type DirectorRepository } from '../persistence';\n",
              '',
              'duplicate controller persistence import',
          )
          broken = (
              "        draft.audit.push({\n"
              "          id: newDirectorId('audit'),\n"
              "          at: isoNow(),\n"
              "          actor: 'Director',\n"
              "          type: 'assignment-released',\n"
              "          summary: `Released ${round.name}.`,\n"
              "          entityId: roundId,\n"
              "        });\n"
              "      });\n"
              "      return true;\n"
              "    },\n"
              "        // Releasing a round is QBTCP's delivery. Recording it as a transfer keeps the unified\n"
              "        // history honest: \"how did this room get its assignment\" has one table with one answer,\n"
              "        // whether that answer was the network, a stick, or both.\n"
              "        recordQbtcpDelivery(draft, roundId);\n"
              "      }),\n"
              "    [commit],\n"
              "  );\n"
          )
          repaired = (
              "        draft.audit.push({\n"
              "          id: newDirectorId('audit'),\n"
              "          at: isoNow(),\n"
              "          actor: 'Director',\n"
              "          type: 'assignment-released',\n"
              "          summary: `Released ${round.name}.`,\n"
              "          entityId: roundId,\n"
              "        });\n"
              "        // Releasing a round is QBTCP's delivery. Recording it as a transfer keeps the unified\n"
              "        // history honest: \"how did this room get its assignment\" has one table with one answer,\n"
              "        // whether that answer was the network, a stick, or both.\n"
              "        recordQbtcpDelivery(draft, roundId);\n"
              "      });\n"
              "      return true;\n"
              "    },\n"
              "    [commit],\n"
              "  );\n"
          )
          text = replace_once(text, broken, repaired, 'releaseRound transfer splice')
          path.write_text(text)

          path = Path('src/director/domain/model.ts')
          text = path.read_text()
          text = replace_once(text, "\nexport const directorSchemaVersion = 1;\n", '\n', 'duplicate Director schema version')
          path.write_text(text)

          path = Path('src/director/persistence/DirectorRepository.ts')
          text = path.read_text()
          old_imports = (
              "import { emptyDirectorState, type DirectorState } from '../domain';\n"
              "import { normalizeDirectorState } from './stateMigrations';\n"
              "import { emptyDirectorState, type DirectorState, directorSchemaVersion } from '../domain';\n"
          )
          new_imports = (
              "import { directorSchemaVersion, emptyDirectorState, type DirectorState } from '../domain';\n"
              "import { normalizeDirectorState } from './stateMigrations';\n"
          )
          text = replace_once(text, old_imports, new_imports, 'duplicate repository imports')
          path.write_text(text)

          path = Path('crates/tournament-store/src/db.rs')
          text = path.read_text()
          broken_parent = '''        let parent = match destination.parent() {
            Some(parent) if !parent.as_os_str().is_empty() => parent.to_path_buf(),
            Some(_) => PathBuf::from("."),
            None => {
                return Err(StoreError::BackupDestinationHasNoParent(
                    destination.clone(),
                ))
            }
        let parent = destination
            .parent()
            .ok_or_else(|| StoreError::BackupDestinationHasNoParent(destination.clone()))?;
        let parent = if parent.as_os_str().is_empty() {
            PathBuf::from(".")
        } else {
            parent.to_path_buf()
        };
'''
          clean_parent = '''        let parent = destination
            .parent()
            .ok_or_else(|| StoreError::BackupDestinationHasNoParent(destination.clone()))?;
        let parent = if parent.as_os_str().is_empty() {
            PathBuf::from(".")
        } else {
            parent.to_path_buf()
        };
'''
          text = replace_once(text, broken_parent, clean_parent, 'backup parent merge')
          text = replace_once(
              text,
              '''            commit_backup_no_replace(&temporary, &destination)?;
            commit_backup_noreplace(&temporary, &destination)?;
''',
              '''            commit_backup_noreplace(&temporary, &destination)?;
''',
              'duplicate backup publish',
          )
          start = text.index('/// Publish a completed backup without replacing a destination')
          end = text.index('fn configure_connection', start)
          text = text[:start] + text[end:]
          text = text.replace('use super::commit_backup_no_replace;', 'use super::commit_backup_noreplace;')
          text = text.replace('commit_backup_no_replace(&temporary, &destination)', 'commit_backup_noreplace(&temporary, &destination)')
          path.write_text(text)

          path = Path('crates/tournament-store/src/repositories/competition.rs')
          text = path.read_text()
          duplicate_models = '''    NewPacket, NewPhase, NewPhaseTeam, NewPool, NewRound, NewScheduledGame, Packet,
    PacketAssignment, Phase, PhaseTeam, Pool, Round, ScheduledGame,
    PacketAssignment, Phase, PhaseTeam, Pool, Round, ScheduledGame, UnixTimestamp,
'''
          clean_models = '''    NewPacket, NewPhase, NewPhaseTeam, NewPool, NewRound, NewScheduledGame, Packet,
    PacketAssignment, Phase, PhaseTeam, Pool, Round, ScheduledGame, UnixTimestamp,
'''
          text = replace_once(text, duplicate_models, clean_models, 'competition model imports')
          path.write_text(text)
          PY
      - name: Install dependencies
        run: npm ci
      - name: Format merged sources
        run: |
          npm run format
          cargo fmt --manifest-path crates/tournament-store/Cargo.toml --all
          cargo fmt --manifest-path apps/director/src-tauri/Cargo.toml --all
          cargo fmt --manifest-path crates/qbtcp-server/Cargo.toml --all
      - name: Validate merge result
        run: |
          npm run format:check
          npm run typecheck
          cargo fmt --manifest-path crates/tournament-store/Cargo.toml --all -- --check
          cargo fmt --manifest-path apps/director/src-tauri/Cargo.toml --all -- --check
          cargo fmt --manifest-path crates/qbtcp-server/Cargo.toml --all -- --check
          cargo check --manifest-path crates/tournament-store/Cargo.toml --all-targets --all-features
      - name: Commit merge cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Resolve main merge integration [pr189-merge-cleanup]"
          git push origin HEAD:gibby/issues-2
