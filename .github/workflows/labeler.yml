name: Label pull requests

# pull_request_target so that pull requests from forks can also be labeled.
# No pull request code is checked out or run here.
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: labeler-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - name: Apply area and type labels
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true

      - name: Apply a size label
        uses: actions/github-script@v7
        with:
          script: |
            const sizes = [
              { label: 'size: XS', limit: 10 },
              { label: 'size: S', limit: 50 },
              { label: 'size: M', limit: 200 },
              { label: 'size: L', limit: 500 },
              { label: 'size: XL', limit: Infinity },
            ]
            // Generated files say nothing about how much there is to review.
            const generated = /^package-lock\.json$|^public\/|\.(svg|png|ico)$/

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.payload.pull_request.number,
            })
            const changed = files
              .filter((file) => !generated.test(file.filename))
              .reduce((total, file) => total + file.additions + file.deletions, 0)
            const wanted = sizes.find((size) => changed < size.limit).label

            const current = context.payload.pull_request.labels.map((label) => label.name)
            for (const stale of current.filter((name) => name.startsWith('size: ') && name !== wanted)) {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                name: stale,
              })
            }
            if (!current.includes(wanted)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels: [wanted],
              })
            }
