name: Director PR 481 fixups

on:
  push:
    branches:
      - gibby/director-redesign-overhaul-8cdd21

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gibby/director-redesign-overhaul-8cdd21
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply targeted TypeScript fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if count is not None and found != count:
                  raise SystemExit(f'{path}: expected {count} occurrences, found {found}: {old!r}')
              if found == 0:
                  raise SystemExit(f'{path}: pattern not found: {old!r}')
              p.write_text(text.replace(old, new))

          replace('src/director/format/FormatView.tsx', "import { useMemo, useState } from 'react';", "import { useState } from 'react';", 1)
          replace('src/director/format/FormatView.tsx', '<ScoringRulesDialog\n          state={state}\n', '<ScoringRulesDialog\n', 1)
          replace('src/director/format/FormatView.tsx', 'function ScoringRulesDialog({\n  state,\n  rules,', 'function ScoringRulesDialog({\n  rules,', 1)
          replace('src/director/format/FormatView.tsx', "  state: DirectorState;\n  rules: NonNullable<DirectorState['tournament']>['rules'];", "  rules: NonNullable<DirectorState['tournament']>['rules'];", 1)

          replace('src/director/live/LiveView.tsx', '  Diagnostics,\n', '', 1)
          replace('src/director/live/LiveView.tsx', '  FieldGrid,\n', '', 1)

          replace('src/director/rooms/RoomsView.tsx', '  Switch,\n', '', 1)
          replace('src/director/rooms/RoomsView.tsx', '  invitations,\n  pairingRoomId,', '  invitations = [],\n  pairingRoomId,', 1)

          replace('src/director/schedule/RoundsView.tsx', 'room.location || undefined', 'room.building || undefined', 3)

          replace(
              'src/director/transfers/TransfersView.tsx',
              "    const files = picked.map(\n      (item) => new File([item.bytes], item.fileName, { type: 'application/vnd.quizbowl.qbj+json' }),\n    );",
              "    const files = picked.map((item) => {\n      const bytes = new ArrayBuffer(item.bytes.byteLength);\n      new Uint8Array(bytes).set(item.bytes);\n      return new File([bytes], item.fileName, { type: 'application/vnd.quizbowl.qbj+json' });\n    });",
              1,
          )
          replace('src/director/transfers/TransfersView.tsx', '        <IncomingView\n          transfers={transfers}\n', '        <IncomingView\n', 1)
          replace('src/director/transfers/TransfersView.tsx', 'function IncomingView({\n  transfers,\n  state,', 'function IncomingView({\n  state,', 1)
          replace('src/director/transfers/TransfersView.tsx', '}: {\n  transfers: TransfersRuntime;\n  state: DirectorState;\n  controller: DirectorController;\n  pending: IncomingArtifact[];', '}: {\n  state: DirectorState;\n  controller: DirectorController;\n  pending: IncomingArtifact[];', 1)
      - name: Install dependencies
        run: npm ci
      - name: Format changed Director sources
        shell: bash
        run: |
          git diff --name-only origin/main...HEAD -- 'src/director/**' 'docs/DIRECTOR_DESIGN_SYSTEM.md' 'apps/director/**' \
            | grep -E '\.(ts|tsx|css|md|json)$' \
            | xargs -r npx prettier --write
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/director-pr481-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Director build and format migrated views'
          git push origin HEAD:gibby/director-redesign-overhaul-8cdd21
