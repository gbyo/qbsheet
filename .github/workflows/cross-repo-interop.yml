name: Cross-repository interop

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      yellowfruit_ref:
        description: Optional YellowFruit branch or ref; otherwise use the matching branch, then master
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: cross-repo-interop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out QBSheet
        uses: actions/checkout@v7

      - name: Resolve YellowFruit companion ref
        id: resolve-yellowfruit
        env:
          REQUESTED_REF: ${{ inputs.yellowfruit_ref }}
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          candidate="${REQUESTED_REF:-$CANDIDATE_REF}"
          if [ -z "$candidate" ]; then candidate=master; fi
          remote_line="$(git ls-remote https://github.com/gbyo/yellowfruit-link.git "refs/heads/$candidate" || true)"
          if [ -z "$remote_line" ]; then
            candidate=master
            remote_line="$(git ls-remote https://github.com/gbyo/yellowfruit-link.git "refs/heads/$candidate")"
          fi
          sha="${remote_line%%$'\t'*}"
          echo "ref=$candidate" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out YellowFruit companion
        uses: actions/checkout@v7
        with:
          repository: gbyo/yellowfruit-link
          ref: ${{ steps.resolve-yellowfruit.outputs.sha }}
          path: yellowfruit-link

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            yellowfruit-link/package-lock.json

      - name: Install QBSheet dependencies
        run: npm ci

      - name: Install YellowFruit dependencies
        working-directory: yellowfruit-link
        run: npm ci --ignore-scripts

      - name: Verify runner Chrome
        run: google-chrome --version

      - name: Install Playwright video helper
        run: npx playwright install ffmpeg

      - name: Run real cross-repository browser contract
        env:
          YELLOWFRUIT_REPO: ${{ github.workspace }}/yellowfruit-link
          YELLOWFRUIT_REF: ${{ steps.resolve-yellowfruit.outputs.sha }}
        run: npm run test:browser:yellowfruit

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cross-repo-interop-playwright
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
