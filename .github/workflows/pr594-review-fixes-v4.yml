name: Apply PR 594 review fixes v4

on:
  push:
    branches:
      - codex/issues-565-568-qbtcp-lifecycle

permissions:
  contents: write

jobs:
  apply-fixes:
    if: ${{ !contains(github.event.head_commit.message, '[pr594-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issues-565-568-qbtcp-lifecycle
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply reviewed lifecycle patch
        shell: bash
        run: |
          git show ee53071318326f55333a64c2959edbd6c10ed4bf:.github/workflows/pr594-review-fixes-v2.yml > /tmp/pr594-v2.yml
          python3 <<'PY'
          from pathlib import Path

          lines = Path('/tmp/pr594-v2.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == "python3 <<'PY'") + 1
          end = next(i for i in range(start, len(lines)) if lines[i].strip() == 'PY')
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start:end])
          exec(compile(script, '<pr594-review-fixes>', 'exec'))
          PY

          npx prettier --write \
            src/director/domain/scheduling.ts \
            src/director/schedule/RoundsView.tsx \
            src/director/state/useDirectorController.ts \
            tests/DirectorIntegration.test.tsx

      - name: Install dependencies
        run: npm ci

      - name: Run targeted Director regression tests
        run: npx vitest --run tests/DirectorIntegration.test.tsx tests/DirectorTournamentCriticalFixes.test.tsx

      - name: Typecheck
        run: npm run typecheck

      - name: Verify formatting
        run: npx prettier --check src/director/domain/scheduling.ts src/director/schedule/RoundsView.tsx src/director/state/useDirectorController.ts tests/DirectorIntegration.test.tsx

      - name: Commit and rebase onto latest PR head
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/director/domain/scheduling.ts \
            src/director/schedule/RoundsView.tsx \
            src/director/state/useDirectorController.ts \
            tests/DirectorIntegration.test.tsx
          git commit -m "fix: close PR 594 lifecycle review gaps [pr594-fix]"
          git fetch origin codex/issues-565-568-qbtcp-lifecycle
          git rebase origin/codex/issues-565-568-qbtcp-lifecycle

      - name: Revalidate rebased patch
        run: |
          npx vitest --run tests/DirectorIntegration.test.tsx tests/DirectorTournamentCriticalFixes.test.tsx
          npm run typecheck
          npx prettier --check src/director/domain/scheduling.ts src/director/schedule/RoundsView.tsx src/director/state/useDirectorController.ts tests/DirectorIntegration.test.tsx

      - name: Push fixes
        run: git push origin HEAD:codex/issues-565-568-qbtcp-lifecycle
