name: PR 189 branch sync

on:
  push:
    branches:
      - gibby/issues-2

permissions:
  contents: write

jobs:
  sync-main:
    if: ${{ !contains(github.event.head_commit.message, '[pr189-sync]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Merge main with guarded conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          if git merge-base --is-ancestor origin/main HEAD; then
            echo "Branch already contains current main."
            exit 0
          fi

          set +e
          git merge --no-ff --no-commit origin/main
          merge_status=$?
          set -e

          if [[ $merge_status -ne 0 ]]; then
            mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
            if [[ ${#conflicts[@]} -eq 0 ]]; then
              echo "Merge failed without ordinary file conflicts."
              exit "$merge_status"
            fi

            allowed_conflict() {
              case "$1" in
                crates/tournament-store/src/db.rs|\
                crates/tournament-store/src/repositories/competition.rs|\
                packages/tournament-core/src/scheduling.ts|\
                src/director/domain/model.ts|\
                src/director/persistence/DirectorRepository.ts|\
                src/director/rooms/RoomsView.tsx|\
                src/director/state/useDirectorController.ts)
                  return 0 ;;
                *) return 1 ;;
              esac
            }

            for file in "${conflicts[@]}"; do
              if ! allowed_conflict "$file"; then
                echo "Unexpected conflict: $file"
                exit 1
              fi
              echo "Union-merging known conflict: $file"
              base_file="$(mktemp)"
              ours_file="$(mktemp)"
              theirs_file="$(mktemp)"
              git show ":1:$file" > "$base_file"
              git show ":2:$file" > "$ours_file"
              git show ":3:$file" > "$theirs_file"
              git merge-file --union "$ours_file" "$base_file" "$theirs_file" || true
              cp "$ours_file" "$file"
              git add "$file"
              rm -f "$base_file" "$ours_file" "$theirs_file"
            done

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved conflicts remain."
              git diff --name-only --diff-filter=U
              exit 1
            fi
          fi

          git commit -m "Merge main into gibby/issues-2 [pr189-sync]"
          git push origin HEAD:gibby/issues-2
