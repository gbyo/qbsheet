name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test -- --run

      - name: Verify project-path build
        run: BASE_PATH=/qbsheet/ npm run build

      - name: Build Director frontend
        run: npm run director:build

      - name: Test Director
        run: npm run director:test

      - name: Test tournament-core
        run: npm run director:core:test

      - name: Test tournament-formats
        run: npm run director:formats:test

      - name: Test the canonical tournament domain
        run: npm run director:domain:test

      # The QBSheet Live protocol, projection, and clients are ordinary TypeScript and belong in
      # the fast gate. Everything that needs `workerd`, Swift, or Xcode is in `qblive.yml`.
      - name: Test QBSheet Live
        run: npm run qblive:test

      - name: Test QBSheet Live Web
        run: npm run live:test

      - name: Build QBSheet Live Web
        run: npm run live:build

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify runner Chrome
        run: google-chrome --version

      - name: Install Playwright video helper
        run: npx playwright install ffmpeg

      - name: Run scorer browser torture test
        run: npm run test:browser

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  rust:
    name: Rust - ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Director native crate
            crate: director
            directory: apps/director/src-tauri
          - name: Tournament store
            crate: tournament-store
            directory: crates/tournament-store
          - name: QBTCP server
            crate: qbtcp-server
            directory: crates/qbtcp-server
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Director Linux dependencies
        if: matrix.crate == 'director'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget

      - name: Cache Cargo dependencies and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.directory }}/target
          key: ${{ runner.os }}-cargo-${{ matrix.crate }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.crate }}-

      - name: Check Rust formatting
        working-directory: ${{ matrix.directory }}
        run: cargo fmt --all -- --check

      - name: Run Clippy
        working-directory: ${{ matrix.directory }}
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run Rust tests
        working-directory: ${{ matrix.directory }}
        run: cargo test --all-targets --all-features
