# Production promotion for the QBSheet web site (Scorer, about pages, creator).
#
# # Why promotion exists
#
# Merging to `main` builds and tests everything but must not move production: a tournament that
# validated one Scorer build must never have its rooms' reloads silently served another because
# an unrelated change merged mid-event. Production moves only when an operator promotes an
# explicit ref here, and rollback is the same action pointed at the prior known-good SHA.
#
# # What the gates enforce
#
# The `gates` job refuses a ref whose own CI check-runs are not all green (or skipped). A ref
# with failures — or with no runs at all, meaning nothing validated it — cannot be promoted.
#
# "Some green checks exist" is not validation: the gate additionally requires the named suites
# that prove the served Scorer to have run green on the exact promoted SHA — `Scorer` (unit),
# `browser` (scorer browser E2E), and `QBSheet Bridge` (bridge/interop). A `skipped` or absent
# run does not count, because path-filtered CI skips exactly the suites a change did not need;
# promoting a ref where they never ran would ship an unproven scorer. `Quality` may be
# success-or-skipped: the promotion build below re-runs the typecheck, but no build step can
# re-prove behavior, so the behavioral suites must have run. The promoted artifact is built
# from that exact ref, and the deployed site carries `scorer-build.json` naming the commit, so
# the promotion is auditable after the fact and a tournament can pin the build it validated
# (#1010).
name: Promote web site to production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA or tag to promote (rollback = promote the prior known-good SHA)'
        required: false
        default: 'main'

permissions:
  contents: read
  pages: write
  id-token: write
  checks: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gates:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve the promoted ref
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
        run: |
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${REF}" --jq .sha)"
          echo "sha=${sha}" >> "${GITHUB_OUTPUT}"
          echo "Promoting ${REF} at ${sha}"

      - name: Require green CI on the promoted ref
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100")"
          total="$(echo "${runs}" | jq '.total_count')"
          if [ "${total}" = "0" ]; then
            echo "::error::No CI check-runs exist for ${SHA}; nothing validated this ref, so it cannot be promoted."
            exit 1
          fi
          bad="$(echo "${runs}" | jq -r '.check_runs[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")) | "\(.name): \(.conclusion)"')"
          if [ -n "${bad}" ]; then
            echo "::error::Refusing to promote ${SHA} with red CI:"
            echo "${bad}"
            exit 1
          fi
          pending="$(echo "${runs}" | jq -r '.check_runs[] | select(.status != "completed") | .name')"
          if [ -n "${pending}" ]; then
            echo "::error::Refusing to promote ${SHA} while CI is still running:"
            echo "${pending}"
            exit 1
          fi
          echo "All ${total} check-runs on ${SHA} are green or skipped."
      - name: Require the named Scorer suites to have run green on the promoted ref
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.resolve.outputs.sha }}
        run: |
          # An arbitrary green check (labeler, CodeQL, docs) must never count as Scorer
          # validation. Each suite below must have at least one completed `success` run on
          # this exact SHA; `skipped` (path-filtered) and absent do not count.
          runs="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?per_page=100" | jq -s '[.[].check_runs[]]')"
          missing="$(echo "${runs}" | jq -r '
            . as $runs
            | ["Scorer", "browser", "QBSheet Bridge"][]
            | select(. as $suite | ($runs | map(select(.name == $suite and .status == "completed" and .conclusion == "success")) | length) == 0)
          ')"
          if [ -n "${missing}" ]; then
            echo "::error::Refusing to promote ${SHA}: these required suites have no green run on this ref:"
            echo "${missing}"
            echo "Promote a ref where CI ran them green (path-filtered skips do not count)."
            exit 1
          fi
          echo "Required suites (Scorer, browser, QBSheet Bridge) are green on ${SHA}."

  build:
    needs: gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out the gated commit exactly
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ needs.gates.outputs.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: BASE_PATH=/ npm run build

      - name: Stamp the promoted commit
        run: |
          echo "Promoted ref: ${{ inputs.ref }}"
          cat dist/scorer-build.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v5
