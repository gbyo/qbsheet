          )
          PY
      - name: Remove temporary workflow
        run: git rm .github/workflows/apply-connected-room-manual-game-v2.yml
      - name: Check patch
        run: |
          git diff --check
          git diff -- src/app/ConnectedRoom.tsx src/app/App.tsx tests/ConnectedRoomStatus.test.tsx
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/ConnectedRoom.tsx src/app/App.tsx tests/ConnectedRoomStatus.test.tsx .github/workflows/apply-connected-room-manual-game-v2.yml
          git commit -m "Fix manual game fallback from connected rooms"
          git push origin HEAD:fix/connected-room-manual-game
