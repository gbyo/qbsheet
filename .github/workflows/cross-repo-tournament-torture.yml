name: Cross-repository tournament torture

on:
  schedule:
    - cron: '37 5 * * 6'
  workflow_dispatch:
    inputs:
      yellowfruit_ref:
        description: Optional YellowFruit branch or ref; otherwise use the matching branch, then master
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: cross-repo-tournament-torture
  cancel-in-progress: false

jobs:
  shard:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: browser contract
            shard: browser
          - name: QBSheet recovery and delivery
            shard: qbsheet-recovery
          - name: YellowFruit receipts and store
            shard: yellowfruit-receipts
          - name: YellowFruit discrepancy and import
            shard: yellowfruit-import
          - name: YellowFruit assignment and room safety
            shard: yellowfruit-rooms
    steps:
      - name: Check out QBSheet
        uses: actions/checkout@v7

      - name: Resolve YellowFruit companion ref
        id: resolve-yellowfruit
        env:
          REQUESTED_REF: ${{ inputs.yellowfruit_ref }}
          CANDIDATE_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail
          candidate="${REQUESTED_REF:-$CANDIDATE_REF}"
          if [ -z "$candidate" ]; then candidate=master; fi
          remote_line="$(git ls-remote https://github.com/gbyo/yellowfruit-link.git "refs/heads/$candidate" || true)"
          if [ -z "$remote_line" ]; then
            candidate=master
            remote_line="$(git ls-remote https://github.com/gbyo/yellowfruit-link.git "refs/heads/$candidate")"
          fi
          sha="${remote_line%%$'\t'*}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out YellowFruit companion
        uses: actions/checkout@v7
        with:
          repository: gbyo/yellowfruit-link
          ref: ${{ steps.resolve-yellowfruit.outputs.sha }}
          path: yellowfruit-link

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          # Scheduled/manual runs may select arbitrary companion refs; keep their dependency
          # cache isolated by disabling the shared npm cache on those privileged triggers.
          cache: ${{ github.event_name == 'pull_request' && 'npm' || '' }}
          cache-dependency-path: package-lock.json

      - name: Install QBSheet dependencies
        run: npm ci

      - name: Install YellowFruit dependencies
        working-directory: yellowfruit-link
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify selected failure domain
        env:
          SHARD: ${{ matrix.shard }}
          YELLOWFRUIT_REPO: ${{ github.workspace }}/yellowfruit-link
          YELLOWFRUIT_REF: ${{ steps.resolve-yellowfruit.outputs.sha }}
        run: |
          set -euo pipefail
          case "$SHARD" in
            browser)
              google-chrome --version
              npx playwright install ffmpeg
              npm run test:browser:yellowfruit
              ;;
            qbsheet-recovery)
              npm test -- --run tests/PortableQbj.test.ts tests/ResultDelivery.test.ts tests/RoomGameSession.test.ts
              ;;
            yellowfruit-receipts)
              (cd yellowfruit-link && npm test -- --run src/__tests__/QbtcpSession.test.ts src/__tests__/QbtcpStore.test.ts)
              ;;
            yellowfruit-import)
              (cd yellowfruit-link && npm test -- --run src/__tests__/QbtcpResult.test.ts src/__tests__/QbjRoundParsing.test.ts)
              ;;
            yellowfruit-rooms)
              (cd yellowfruit-link && npm test -- --run src/__tests__/QbtcpAssignment.test.ts src/__tests__/ScheduledGameRooms.test.ts src/__tests__/TeamDeletionSafety.test.ts)
              ;;
            *)
              echo "Unknown shard: $SHARD" >&2
              exit 2
              ;;
          esac

      - name: Upload shard failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cross-repo-torture-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
