# The QBSheet Live Xcode project.
#
# Generated by XcodeGen from this file. The generated `QBSheetLive.xcodeproj` is committed so that a
# contributor with only Xcode can open and build it, but `project.yml` is the source of truth: an
# edit made in Xcode's target editor and not made here is lost the next time anybody regenerates.
#
#     brew install xcodegen && xcodegen generate
#
# See docs/QBLIVE_IOS.md for the App Store Connect setup these identifiers assume.

name: QBSheetLive
options:
  bundleIdPrefix: com.qbsheet
  # iOS 18. QBSheet Live uses ActivityKit broadcast push channels, which are 18-and-later, and the
  # prompt for this work is explicit that no pre-18 compatibility is to be carried for Live alone.
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true
  xcodeVersion: "26.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Placeholders. Replace with the real Team ID before an App Store build; the AASA file and the
    # associated-domains entitlements have to agree with it. See docs/QBLIVE_IOS.md.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO

packages:
  QBSheetLiveKit:
    path: QBSheetLiveKit

targets:
  # ---------------------------------------------------------------- full app
  QBSheetLive:
    type: application
    platform: iOS
    sources:
      - path: QBSheetLive
      - path: Shared
    dependencies:
      - package: QBSheetLiveKit
        product: QBSheetLiveKit
      - target: QBSheetLiveActivity
        embed: true
      - target: QBSheetLiveClip
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qbsheet.live
        INFOPLIST_FILE: QBSheetLive/Info.plist
        CODE_SIGN_ENTITLEMENTS: QBSheetLive/QBSheetLive.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  # ---------------------------------------------------------------- App Clip
  QBSheetLiveClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - path: QBSheetLiveClip
      - path: Shared
    dependencies:
      - package: QBSheetLiveKit
        product: QBSheetLiveKit
      - target: QBSheetLiveClipActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qbsheet.live.Clip
        INFOPLIST_FILE: QBSheetLiveClip/Info.plist
        CODE_SIGN_ENTITLEMENTS: QBSheetLiveClip/QBSheetLiveClip.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES

  # ------------------------------------------------- Live Activity extensions
  QBSheetLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: QBSheetLiveActivity
      - path: QBSheetLiveActivity/QBSheetLiveActivityView.swift
    dependencies:
      - package: QBSheetLiveKit
        product: QBSheetLiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qbsheet.live.Activity
        INFOPLIST_FILE: QBSheetLiveActivity/Info.plist
        CODE_SIGN_ENTITLEMENTS: QBSheetLiveActivity/QBSheetLiveActivity.entitlements
        SKIP_INSTALL: YES

  QBSheetLiveClipActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: QBSheetLiveClipActivity
      # The same view, compiled into both extensions. An App Clip cannot host the containing app's
      # extensions, so the target must exist; sharing the source is what keeps the two identical.
      - path: QBSheetLiveActivity/QBSheetLiveActivityView.swift
    dependencies:
      - package: QBSheetLiveKit
        product: QBSheetLiveKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.qbsheet.live.Clip.Activity
        INFOPLIST_FILE: QBSheetLiveClipActivity/Info.plist
        CODE_SIGN_ENTITLEMENTS: QBSheetLiveClipActivity/QBSheetLiveClipActivity.entitlements
        SKIP_INSTALL: YES

schemes:
  QBSheetLive:
    build:
      targets:
        QBSheetLive: all
    run:
      config: Debug
    # The shared kit's tests run through its own package scheme
    # (`xcodebuild test -scheme QBSheetLiveKit`), because a Swift package's test target is not a
    # target of this project and cannot be listed here.
    archive:
      config: Release

  QBSheetLiveClip:
    build:
      targets:
        QBSheetLiveClip: all
    run:
      config: Debug
    archive:
      config: Release
