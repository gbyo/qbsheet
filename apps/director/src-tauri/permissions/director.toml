[[permission]]
identifier = "director-operations"
description = "Allow the Director window to use its explicitly registered native operations."
commands.allow = [
  "director_load_state",
  "director_list_tournaments",
  "director_read_tournament",
  "director_open_tournament",
  "director_save_state",
  "director_save_document",
  "director_checkpoint",
  "director_list_checkpoints",
  "director_read_checkpoint",
  "director_restore_checkpoint",
  "director_server_status",
  "director_server_snapshot",
  "director_start_qbtcp_server",
  "director_stop_qbtcp_server",
  "get_application_paths",
  "get_store_status",
  "checkpoint_store",
  "open_tournament_file",
  "save_tournament_file",
  "get_diagnostics_snapshot",
  "save_diagnostics_bundle",
  "transfers_list_volumes",
  "transfers_choose_folder",
  "transfers_authorize_root",
  "transfers_forget_root",
  "transfers_list_directory",
  "transfers_read_file",
  "transfers_write_file",
  "transfers_create_directory",
  "transfers_exists",
  "transfers_available_bytes",
]
