[package]
name = "qbsheet-director"
version = "0.1.0"
description = "QBSheet Director native tournament control shell"
authors = ["QBSheet contributors"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/gbyo/qbsheet"
edition = "2021"
rust-version = "1.80"

[lib]
name = "qbsheet_director_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.23.1"
if-addrs = "0.13.4"
qbtcp-server = { path = "../../../crates/qbtcp-server" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sysinfo = { version = "0.38", default-features = false, features = ["disk"] }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-updater = "2.11.0"
tauri-plugin-window-state = "2.4.1"
thiserror = "2.0.20"
tokio = { version = "1", features = ["net", "rt", "macros"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem"] }
