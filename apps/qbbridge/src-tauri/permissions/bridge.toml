[[permission]]
identifier = "bridge-operations"
description = "Allow the QBSheet Bridge window to use native file, secure-storage, and relay operations."
commands.allow = [
  "open_yellowfruit_file",
  "choose_result_folder",
  "choose_assignment_folder",
  "open_recovery_package",
  "yellowfruit_source_metadata",
  "read_yellowfruit_source",
  "write_recovery_package",
  "store_relay_credential",
  "load_relay_credential",
  "delete_relay_credential",
  "write_result_file",
  "relay_request",
  "write_assignment_file",
]
