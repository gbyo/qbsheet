[package]
name = "qblive-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Hosting-neutral QBLive v1 server core for QBServer, Director local mode, and conformance fixtures"
license = "MIT"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
tokio = { version = "1", features = ["net", "rt", "macros", "sync"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false }
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "macros", "sync"] }
tower = { version = "0.5", features = ["util"] }
