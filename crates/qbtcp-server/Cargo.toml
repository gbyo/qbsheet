[package]
name = "qbtcp-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "Protocol-neutral QBTCP v1 server core and HTTP transport for QBSheet Director"
license = "MIT"

[dependencies]
axum = "0.8"
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["net", "rt", "macros"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
